[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baqbaq"
version = "0.1.0"
description = "Explainable AI agent for organizational document comparison"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "python-multipart==0.0.20",
  "pypdf==5.4.0",
  "openpyxl==3.1.5",
  "openai==1.75.0",
  "python-dotenv==1.1.0",
  "fastembed==0.7.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
