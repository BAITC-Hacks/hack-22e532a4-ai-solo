limit_req_zone $binary_remote_addr zone=baqbaq_requests:1m rate=120r/m;
limit_conn_zone $server_name zone=baqbaq_connections:1m;
server {
    listen 80;
    server_name baqbaq.world www.baqbaq.world;
    location /.well-known/acme-challenge/ { root /opt/baqbaq/acme; }
    location / { return 301 https://baqbaq.world$request_uri; }
}
server {
    listen 443 ssl;
    server_name baqbaq.world www.baqbaq.world;
    ssl_certificate /etc/letsencrypt/live/baqbaq.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baqbaq.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location / {
        limit_conn baqbaq_connections 8;
        limit_req zone=baqbaq_requests burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8022;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
    }
}
